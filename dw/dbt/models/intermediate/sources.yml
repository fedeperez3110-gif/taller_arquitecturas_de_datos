version: 2

# raw_data acumula todos los lotes cargados con COPY (cada fila con _batch_id y _extracted_at).
# El esquema se llama raw_data porque RAW es palabra reservada en Redshift.
sources:
  - name: mysql_raw
    schema: raw_data
    tables:
      - name: mysql_customers
      - name: mysql_products
      - name: mysql_orders
      - name: mysql_order_items
  - name: mongodb_raw
    schema: raw_data
    tables:
      - name: mongo_reviews
      - name: mongo_navigation_events
