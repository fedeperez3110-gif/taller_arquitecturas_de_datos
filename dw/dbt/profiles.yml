# Perfil de Redshift Serverless. Las credenciales llegan como variables de entorno que
# dw/dbt_runner.py toma de AWS Secrets Manager; este archivo no contiene secretos.
ecommerce_dw:
  target: aws
  outputs:
    aws:
      type: redshift
      host: "{{ env_var('DBT_REDSHIFT_HOST') }}"
      port: "{{ env_var('DBT_REDSHIFT_PORT', '5439') | as_number }}"
      user: "{{ env_var('DBT_REDSHIFT_USER') }}"
      password: "{{ env_var('DBT_REDSHIFT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_REDSHIFT_DATABASE') }}"
      schema: intermediate
      threads: 4
      sslmode: require
      connect_timeout: 30
